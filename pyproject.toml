[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "security-agents"
version = "0.1.1"
description = "Defensive security toolkit: Semgrep rules, fuzzing, prompt-injection robustness harness"
requires-python = ">=3.9"
dependencies = ["hypothesis>=6.100", "pyyaml>=6.0"]

[project.optional-dependencies]
sast = ["semgrep>=1.38"]
fetch = ["httpx>=0.27"]          # secprim.safe_fetch (RC-4)
xml = ["defusedxml>=0.7"]        # stronger backend for secprim.safe_xml_fromstring
# coverage-guided fuzzing; needs a clang with libFuzzer (Linux). On macOS use
# fuzzing/run_atheris.sh, which runs it through fuzzing/Dockerfile.atheris.
fuzz-native = ["atheris>=2.3"]
# agent-eval harness (evals/agent): the model loop outside the box. Pinned; nothing else.
agent = ["anthropic==1.5.0"]
# calibration pipeline (evals/calib): Harbor runs the advisory tasks (sandbox, verifier,
# trajectories). Pinned release verified on PyPI 2026-11-27 (0.27.0, 2026-11-21); needs
# Python >= 3.12. Unit tests never import it.
calib = ["harbor==0.27.0", "harbor-rewardkit==0.2.4"]
# test-time statistical oracles only (SURVEY.md §6.21); runtime estimators stay stdlib.
dev = ["scipy>=1.11", "statsmodels>=0.14"]

[tool.setuptools]
packages = ["promptinject", "promptinject.corpus", "fuzzing", "secprim", "evals", "evals.agent", "evals.calib"]
