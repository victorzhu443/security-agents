[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "security-agents"
version = "0.1.0"
description = "Defensive security toolkit: Semgrep rules, fuzzing, prompt-injection robustness harness"
requires-python = ">=3.9"
dependencies = ["hypothesis>=6.100"]

[project.optional-dependencies]
sast = ["semgrep>=1.38"]

[tool.setuptools]
packages = ["promptinject", "promptinject.corpus", "fuzzing"]
