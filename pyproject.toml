[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "security-agents"
version = "0.1.1"
description = "Defensive security toolkit: Semgrep rules, fuzzing, prompt-injection robustness harness"
requires-python = ">=3.9"
dependencies = ["hypothesis>=6.100"]

[project.optional-dependencies]
sast = ["semgrep>=1.38"]
fetch = ["httpx>=0.27"]          # secprim.safe_fetch (RC-4)
xml = ["defusedxml>=0.7"]        # stronger backend for secprim.safe_xml_fromstring
# coverage-guided fuzzing; needs a clang with libFuzzer (Linux). On macOS use
# fuzzing/run_atheris.sh, which runs it through fuzzing/Dockerfile.atheris.
fuzz-native = ["atheris>=2.3"]

[tool.setuptools]
packages = ["promptinject", "promptinject.corpus", "fuzzing", "secprim"]
