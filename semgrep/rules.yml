## Custom Semgrep rules for Victor's projects.
## Run:  semgrep --config semgrep/rules.yml --config "p/python" --config "p/django" <path>
## These complement the registry packs (p/python, p/django, p/secrets, p/owasp-top-ten);
## they encode the project-specific risks the generic packs miss, especially the
## LLM-app input-handling rules (LLM01) that no stock pack covers well.
rules:
  - id: untrusted-text-into-prompt-sink
    languages: [python]
    severity: WARNING
    message: >
      Untrusted text is interpolated into a prompt/message sent to a model. This is
      the prompt-injection (OWASP LLM01) sink: data becomes instruction. Route the
      value through promptinject.defense.harden() before it enters the prompt, and
      keep task instructions in a system prompt the app controls.
    metadata:
      category: security
      cwe: "CWE-74: Improper Neutralization of Special Elements"
      owasp: "LLM01: Prompt Injection"
    patterns:
      # Only fire on real message/prompt construction, not logs or report strings.
      - pattern-either:
          - pattern: '{..., "content": f"...{$DOC}...", ...}'
          - pattern: content=f"...{$DOC}..."
          - pattern: HumanMessage(f"...{$DOC}...")
          - pattern: HumanMessage(content=f"...{$DOC}...")
          - pattern: $PROMPT.format(..., $K=$DOC, ...)
      - metavariable-regex:
          metavariable: $DOC
          # $DOC is the whole f-string expression; a value already routed through
          # a hardening call is the fix, not the finding.
          regex: '(?i)^(?!.*\b(?:harden|harden_untrusted|neutralize|spotlight|untrusted|scrub_output)\s*\().*(text|content|document|page|chunk|body|source|passage|snippet|html|paper|user_input|answer|summary).*'

  # ---- LLM01 via templated prompts (LangChain) --------------------------------
  # The rule above sees the string being built. A LangChain template separates
  # the two halves: the placeholder lives in ChatPromptTemplate.from_messages /
  # PromptTemplate, and the untrusted value is bound later by chain.invoke({...}),
  # .format_messages(k=v), or a project wrapper that forwards the dict. The next
  # two rules cover each half: the bind site is the finding (WARNING); the
  # template is a pointer to go and check the bind site (INFO).
  - id: untrusted-placeholder-bound-unhardened
    languages: [python]
    severity: WARNING
    message: >
      An untrusted-looking placeholder ("$K") is bound to a raw value at a prompt
      bind site ($F). If the template this feeds is sent to a model, this is the
      prompt-injection (OWASP LLM01) sink: the value becomes part of the
      instruction. Wrap the value at the bind site — harden(...) /
      harden_untrusted(...) from the project's security module, or Untrusted(...)
      via build_prompt(...) — and keep the directive in the system message.
    metadata:
      category: security
      cwe: "CWE-74: Improper Neutralization of Special Elements"
      owasp: "LLM01: Prompt Injection"
    patterns:
      - pattern-either:
          # chain.invoke({...}) / .ainvoke / .stream, and project wrappers that
          # take the dict positionally (invoke_chain, invoke_with_retry).
          - pattern: '$F(..., {..., "$K": $V, ...}, ...)'
          # .batch([{...}, {...}]) — only literal dicts; a comprehension is opaque.
          - pattern: '$F(..., [..., {..., "$K": $V, ...}, ...], ...)'
          # .invoke(input={...})
          - pattern: '$F(..., input={..., "$K": $V, ...}, ...)'
          # tmpl.format(**{...}) / .format_messages(**{...})
          - pattern: '$F(**{..., "$K": $V, ...})'
          # tmpl.format_messages(k=v) / .format_prompt(k=v) / .format(k=v)
          - pattern: $F(..., $K=$V, ...)
      # The callee must look like a chain invocation or template render.
      # metavariable-regex is anchored at the start of the bound text, so the
      # optional dotted prefix is spelled out.
      - metavariable-regex:
          metavariable: $F
          regex: (?i)^(.*\.)?(a?invoke|a?batch|a?stream|invoke_chain|invoke_with_retry|a?format|a?format_messages|a?format_prompt)$
      # The key is the same untrusted-name list as the rule above, plus the
      # names the projects actually use for scraped/uploaded text.
      - metavariable-regex:
          metavariable: $K
          regex: (?i).*(text|content|document|page|chunk|body|source|passage|snippet|html|paper|user_input|answer|summary|job_text|resume_text|query).*
      # The value is exempt when it is a plain string literal (app-controlled)
      # or when the expression *is* a call to a sanctioned hardening function,
      # optionally module-qualified or parenthesised. A hardening call nested
      # deeper (a if ok else harden(a)) does not exempt the value.
      - metavariable-regex:
          metavariable: $V
          regex: (?s)^(?!\s*["'])(?!\s*\(*\s*([\w.]+\.)?(harden|harden_untrusted|Untrusted|build_prompt)\s*\().*$
      - focus-metavariable: $V

  - id: untrusted-placeholder-in-prompt-template
    languages: [python]
    severity: INFO
    message: >
      This prompt template has an untrusted-looking placeholder ({...$TMPL...}
      names text/content/document/query/...). The template is not the finding —
      confirm the bind site (chain.invoke / format_messages / the project's
      invoke wrapper) hardens the value before it is bound, and that the system
      message carries the data-not-instruction directive. See
      untrusted-placeholder-bound-unhardened for the bind-site check.
    metadata:
      category: security
      cwe: "CWE-74: Improper Neutralization of Special Elements"
      owasp: "LLM01: Prompt Injection"
    patterns:
      - pattern-either:
          # ChatPromptTemplate.from_messages([("human", "..."), ...]); the
          # string may be concatenated with a directive constant on either side.
          - pattern: '$T.from_messages([..., ("$ROLE", "$TMPL"), ...])'
          - pattern: '$T.from_messages([..., ("$ROLE", "$TMPL" + $REST), ...])'
          - pattern: '$T.from_messages([..., ("$ROLE", $PRE + "$TMPL"), ...])'
          # from_messages(["...", ...]) and nested *.from_template("...") entries
          - pattern: '$T.from_messages([..., "$TMPL", ...])'
          - pattern: '$T.from_messages([..., $M("$TMPL"), ...])'
          # ChatPromptTemplate.from_template("...") / PromptTemplate(template="...")
          - pattern: '$T.from_template("$TMPL", ...)'
          - pattern: '$T(..., template="$TMPL", ...)'
      - metavariable-regex:
          metavariable: $TMPL
          regex: (?is).*\{[a-z0-9_]*(text|content|document|page|chunk|body|source|passage|snippet|html|paper|user_input|answer|summary|job_text|resume_text|query)[a-z0-9_]*\}.*
      - focus-metavariable: $TMPL

  - id: subprocess-shell-true
    languages: [python]
    severity: ERROR
    message: >
      subprocess called with shell=True. If any part of the command derives from
      input this is command injection (CWE-78). Pass a list of args and shell=False.
    metadata: {category: security, cwe: "CWE-78"}
    patterns:
      - pattern-either:
          - pattern: subprocess.run(..., shell=True, ...)
          - pattern: subprocess.Popen(..., shell=True, ...)
          - pattern: subprocess.call(..., shell=True, ...)
          - pattern: os.system(...)

  - id: yaml-unsafe-load
    languages: [python]
    severity: ERROR
    message: "yaml.load without SafeLoader executes arbitrary objects (CWE-502). Use yaml.safe_load."
    metadata: {category: security, cwe: "CWE-502"}
    patterns:
      - pattern: yaml.load($X)

  - id: pickle-load-untrusted
    languages: [python]
    severity: WARNING
    message: >
      pickle.load/loads deserializes arbitrary code (CWE-502). Safe only for data
      you produced and trust; never for downloaded or user-supplied bytes.
    metadata: {category: security, cwe: "CWE-502"}
    patterns:
      - pattern-either:
          - pattern: pickle.load(...)
          - pattern: pickle.loads(...)

  - id: requests-verify-disabled
    languages: [python]
    severity: ERROR
    message: "TLS verification disabled (verify=False) — enables MITM (CWE-295)."
    metadata: {category: security, cwe: "CWE-295"}
    patterns:
      - pattern: requests.$M(..., verify=False, ...)

  - id: sql-string-format
    languages: [python]
    severity: ERROR
    message: "SQL built by string formatting/concatenation — SQL injection (CWE-89). Use parameters."
    metadata: {category: security, cwe: "CWE-89"}
    patterns:
      - pattern-either:
          - pattern: $CUR.execute(f"...", ...)
          - pattern: $CUR.execute("..." % ..., ...)
          - pattern: $CUR.execute("..." + $X, ...)

  - id: eval-exec-call
    languages: [python]
    severity: ERROR
    message: "eval()/exec() on a runtime value is code injection (CWE-95). Avoid."
    metadata: {category: security, cwe: "CWE-95"}
    patterns:
      - pattern-either:
          - pattern: eval(...)
          - pattern: exec(...)

  - id: django-debug-true
    languages: [python]
    severity: WARNING
    message: "DEBUG = True leaks stack traces and settings in responses (CWE-489). Gate on env for prod."
    metadata: {category: security, cwe: "CWE-489"}
    patterns:
      - pattern: DEBUG = True

  - id: hardcoded-secret-assignment
    languages: [python]
    severity: ERROR
    message: "Possible hardcoded secret. Load from env/secret store, never commit the literal."
    metadata: {category: security, cwe: "CWE-798"}
    patterns:
      - pattern-either:
          - pattern: $K = "..."
      - metavariable-regex:
          metavariable: $K
          regex: (?i)(api_key|apikey|secret|password|passwd|token|private_key|aws_secret)
      - metavariable-regex:
          metavariable: $K
          regex: ^(?!.*(EXAMPLE|PLACEHOLDER|os\.environ)).*$

  # ---- RC-9: hardening defaults (see DESIGN.md §3.9) -------------------------
  - id: weak-hash-non-crypto
    languages: [python]
    severity: WARNING
    message: >
      sha1/md5 without usedforsecurity=False. If this is a cache key or fingerprint,
      pass usedforsecurity=False (keeps the digest stable, states intent, clears
      scanners); if it is new, use hashlib.sha256. Never use these for signatures.
    metadata: {category: security, cwe: "CWE-328"}
    patterns:
      - pattern-either:
          - patterns:
              - pattern: hashlib.$H(...)
              - metavariable-regex:
                  metavariable: $H
                  regex: ^(sha1|md5)$
          - pattern: hashlib.new("=~/^(?i)(sha1|md5)$/", ...)
      - pattern-not: hashlib.$H(..., usedforsecurity=False, ...)
      - pattern-not: hashlib.new(..., usedforsecurity=False, ...)

  - id: torch-load-unsafe
    languages: [python]
    severity: WARNING
    message: >
      torch.load without weights_only=True unpickles arbitrary objects (CWE-502).
      Pass weights_only=True for model weights; only load full objects from
      artifacts you produced and trust.
    metadata: {category: security, cwe: "CWE-502"}
    patterns:
      - pattern: torch.load(...)
      - pattern-not: torch.load(..., weights_only=True, ...)

  - id: flask-dev-bind-all
    languages: [python]
    severity: WARNING
    message: >
      Flask's development server bound to 0.0.0.0. Serve production behind
      gunicorn/an ingress; keep app.run() for local development on 127.0.0.1.
    metadata: {category: security, cwe: "CWE-668"}
    pattern-either:
      - pattern: $APP.run(..., host="=~/^(0\.0\.0\.0|::)$/", ...)
      - pattern: $APP.run("=~/^(0\.0\.0\.0|::)$/", ...)

  # --- evals phase 2 (P3/P8) ---------------------------------------------------
  # Rules added while building the eval corpus (evals/cases/P3, P8). Each one
  # closes a shape the corpus showed the rules above missing; fixtures live in
  # tests/test_rules.py and the matching eval case is named in the message.
  - id: untrusted-placeholder-bound-indirect
    languages: [python]
    severity: WARNING
    message: >
      An untrusted-looking placeholder ("$K") is bound to a raw value in a dict
      that is then passed to a prompt bind site ($F). This is the same LLM01 sink
      as untrusted-placeholder-bound-unhardened, one assignment removed: the
      inputs dict is built first and invoked later, so the bind-site rule never
      sees the key. Wrap the value where the dict is built — harden(...) /
      harden_untrusted(...) / Untrusted(...) via build_prompt(...). Eval case:
      P8-langchain-indirect-bind-01.
    metadata:
      category: security
      cwe: "CWE-74: Improper Neutralization of Special Elements"
      owasp: "LLM01: Prompt Injection"
    patterns:
      - pattern-either:
          - pattern: |
              $D = {..., "$K": $V, ...}
              ...
              $F(..., $D, ...)
          - pattern: |
              $D = {..., "$K": $V, ...}
              ...
              $F(..., input=$D, ...)
          - pattern: |
              $D = {..., "$K": $V, ...}
              ...
              $F(**$D)
      - metavariable-regex:
          metavariable: $F
          regex: (?i)^(.*\.)?(a?invoke|a?batch|a?stream|invoke_chain|invoke_with_retry|a?format|a?format_messages|a?format_prompt)$
      - metavariable-regex:
          metavariable: $K
          regex: (?i).*(text|content|document|page|chunk|body|source|passage|snippet|html|paper|user_input|answer|summary|job_text|resume_text|query).*
      - metavariable-regex:
          metavariable: $V
          regex: (?s)^(?!\s*["'])(?!\s*\(*\s*([\w.]+\.)?(harden|harden_untrusted|Untrusted|build_prompt)\s*\().*$
      - focus-metavariable: $V

  - id: inprocess-import-of-generated-code
    languages: [python]
    severity: WARNING
    message: >
      A module file from a work / output / generated-code location is imported or
      run INSIDE this process (importlib exec_module / load_module / runpy). Code
      the application did not write then runs with the orchestrator's environment,
      credentials, cwd and network — there is no containment boundary at all
      (RC-3). Run it in a child process through the sandbox boundary (cwd=workdir,
      env=secprim.child_env(...), a file-based call protocol) instead. The location
      heuristic is by name; a path variable named `path` is not flagged. Eval case:
      P3-inprocess-import-01.
    metadata:
      category: security
      cwe: "CWE-94: Improper Control of Generation of Code"
    patterns:
      - pattern-either:
          # the location expression is in the call
          - patterns:
              - pattern-either:
                  - pattern: |
                      $SPEC = importlib.util.spec_from_file_location($N, $P, ...)
                      ...
                      $SPEC.loader.exec_module($M)
                  - pattern: runpy.run_path($P, ...)
                  - pattern: $L.load_module($P, ...)
              - metavariable-regex:
                  metavariable: $P
                  regex: (?i).*(work|generated|pipeline|untrusted|foreign|model_code|agent|output|download|upload|scratch|tmp).*
          # the location was assigned first (orchestrator._load_pipeline's shape)
          - patterns:
              - pattern-either:
                  - pattern: |
                      $P = $E
                      ...
                      $SPEC = importlib.util.spec_from_file_location($N, $P, ...)
                      ...
                      $SPEC.loader.exec_module($M)
                  - pattern: |
                      $P = $E
                      ...
                      runpy.run_path($P, ...)
              - metavariable-regex:
                  metavariable: $E
                  regex: (?i).*(work|generated|pipeline|untrusted|foreign|model_code|agent|output|download|upload|scratch|tmp).*
