name: security-ci
# Runs the toolkit's own checks: SAST self-scan, prompt-injection demo, self-tests.
# Copy the `sast` job into any project to get Semgrep on every push (point --config
# at ../security-agents/semgrep/rules.yml plus the registry packs for its stack).
on:
  push:
  pull_request:

jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install semgrep
      - name: Semgrep (custom rules + python/secrets packs)
        run: semgrep scan --config semgrep/rules.yml --config p/python --config p/secrets --error --metrics off .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[fetch]" pytest semgrep
      - name: Prompt-injection demo (vulnerable vs hardened)
        run: python -m promptinject.harness
      - name: Toolkit self-tests (primitives, harness, rules)
        run: pytest tests/ -q

  # RC-7: dependency audit. Copy this job into any project (point it at that
  # project's lockfile / requirements). Fails on known vulnerabilities; accepted
  # risks go in an ignore list with an expiry, never silently.
  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pip-audit && pip install -e ".[fetch]"
      - name: pip-audit (installed environment)
        run: pip-audit --strict --progress-spinner off
