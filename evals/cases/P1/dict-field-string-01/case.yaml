id: P1-dict-field-string-01
property: P1
origin: derived
grader: fuzz
description: >
  A dict-typed field ("controls", a name -> config map) receives a string, list
  or number; the envelope was checked but the field was assumed, so .items()
  raises an undeclared AttributeError. Clean passes the field through as_dict.
expect:
  target: settings:apply
  strategy: json
  allowed: [MalformedInput]
  max_examples: 500
