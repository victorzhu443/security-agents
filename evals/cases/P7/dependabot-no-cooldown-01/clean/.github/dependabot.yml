# Weekly dependency and action updates. Every block waits 7 days after a release
# before proposing it (cooldown): a malicious or broken release is usually pulled
# within days, and the delay keeps it out of the repo meanwhile.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
