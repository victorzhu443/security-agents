# USD per million tokens, Anthropic first-party API list prices as of 2026-11-26
# (claude-api skill, "Current Models" table; cache-read rates from the model notes).
# loop.py computes a trial's cost from `usage` with these; the runner records the measured
# cost per task so later runs are planned from data (EVALS-PLAN.md budget schedule).
#
# cache_write is billed at 1.25x input for a 5-minute cache on every model here.
# Haiku 5.5 has a second rate card for prompts over 100K tokens (0.50 / 2.50); the harness
# keeps prompts under that line, so the base card applies.
as_of: "2026-11-26"
models:
  claude-haiku-5-5:
    input: 0.10
    output: 0.50
    cache_read: 0.01
    cache_write: 0.125
  claude-sonnet-5-5:
    input: 2.00
    output: 10.00
    cache_read: 0.20
    cache_write: 2.50
  claude-opus-5-5:
    input: 4.00
    output: 20.00
    cache_read: 0.20
    cache_write: 5.00
